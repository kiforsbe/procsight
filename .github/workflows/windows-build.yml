name: Windows build and MSI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-build-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    outputs:
      artifact: ProcSight-${{ steps.package.outputs.version }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
      commit: ${{ steps.package.outputs.commit }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      REQUESTED_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate release tag input
        run: |
          if ($env:REQUESTED_TAG -cnotmatch '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') {
            throw 'Select an existing stable vMAJOR.MINOR.PATCH tag.'
          }

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify checked-out tag and product version
        run: |
          $ErrorActionPreference = 'Stop'
          $tagRef = "refs/tags/$env:REQUESTED_TAG"
          $tagCommit = & git rev-parse --verify --end-of-options "$tagRef^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Requested release tag does not exist.' }
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $tagCommit) { throw 'Checkout does not match the requested tag.' }
          . ./scripts/release/Common.ps1
          $version = Read-ProcSightVersion $PWD
          if ($env:REQUESTED_TAG -cne "v$version") { throw 'Release tag does not match the central product version.' }
          Assert-ProcSightVersionConsistency $PWD

      - name: Install repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: x64
          cache: false

      - name: Verify Release build and tests
        run: ./scripts/verify.ps1 -Configuration Release

      - name: Build and stage unsigned MSI
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @(& ./scripts/package.ps1 -Profile Msi)
          $packages = @($results | Where-Object {
            $_.PSObject.Properties.Name -contains 'Artifact' -and
            $_.PSObject.Properties.Name -contains 'Manifest'
          })
          if ($packages.Count -ne 1) { throw 'Expected one inspected MSI result.' }
          $package = $packages[0]
          $manifest = Get-Content -LiteralPath $package.Manifest -Raw | ConvertFrom-Json
          if ($manifest.Profile -ne 'Msi' -or $manifest.Signed -or
              [IO.Path]::GetExtension($package.Artifact) -ne '.msi') {
            throw 'Expected an unsigned MSI build artifact.'
          }
          $stage = Join-Path $PWD 'artifacts/github-msi'
          $null = New-Item -ItemType Directory -Path $stage
          $stagedMsi = Join-Path $stage ([IO.Path]::GetFileName($package.Artifact))
          Copy-Item -LiteralPath $package.Artifact -Destination $stagedMsi
          Copy-Item -LiteralPath $package.Manifest -Destination (Join-Path $stage 'release-artifacts.json')
          if ((Get-FileHash -LiteralPath $stagedMsi -Algorithm SHA256).Hash -cne $manifest.SHA256) {
            throw 'Staged MSI hash differs from its inspected manifest.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($package.Version)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$($package.Commit)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Unsigned ProcSight $($package.Version) MSI verified. Download it from this run's Artifacts section."

      - name: Upload MSI and hash manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProcSight-${{ steps.package.outputs.version }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-msi/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

  draft-release:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      # No checkout, tagged scripts, build tools or third-party Actions in this write-enabled job.
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3
          if ($env:REQUESTED_TAG -cnotmatch '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$' -or
              $env:EXPECTED_COMMIT -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Invalid release tag or build commit.'
          }
          $stage = Join-Path $PWD 'release-assets'
          gh run download $env:GITHUB_RUN_ID --repo $env:GH_REPO --name $env:ARTIFACT_NAME --dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Could not download this build artifact.' }
          $version = $env:REQUESTED_TAG.Substring(1)
          $msiName = "ProcSight-$version-x64-unsigned.msi"
          $files = @(Get-ChildItem -LiteralPath $stage -Force)
          if ($files.Count -ne 2 -or @($files | Where-Object {
                $_.PSIsContainer -or $_.LinkType -or $_.Name -cnotin @($msiName, 'release-artifacts.json')
              }).Count -ne 0) { throw 'Unexpected release artifact contents.' }
          $manifestPath = Join-Path $stage 'release-artifacts.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $msiPath = Join-Path $stage $msiName
          if ($manifest.Version -cne $version -or $manifest.Commit -cne $env:EXPECTED_COMMIT -or
              $manifest.Profile -cne 'Msi' -or $manifest.Signed -isnot [bool] -or $manifest.Signed -or
              $manifest.Artifact -cne $msiName -or $manifest.SHA256 -notmatch '^[a-fA-F0-9]{64}$' -or
              (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash -ine $manifest.SHA256) {
            throw 'Release artifact does not match the verified build.'
          }
          $tagCommit = gh api "repos/$env:GH_REPO/commits/$env:REQUESTED_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:EXPECTED_COMMIT) {
            throw 'Remote tag no longer matches the verified build.'
          }
          $releaseJson = gh api "repos/$env:GH_REPO/releases" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          $releases = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $env:REQUESTED_TAG })
          if ($releases.Count -gt 1) { throw 'Multiple releases found for this tag.' }
          if ($releases.Count -eq 1) {
            $existing = $releases[0]
            if (!$existing.draft) { throw 'This tag already has a published release; it will not be changed.' }
            if (@($existing.assets | Where-Object { $_.name -cin @($msiName, 'release-artifacts.json') }).Count -gt 0) {
              throw 'Draft already contains these assets. Review and remove them manually before retrying; assets are never overwritten.'
            }
            gh release upload $env:REQUESTED_TAG $msiPath $manifestPath --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed. Inspect the draft before retrying.' }
          } else {
            $notes = Join-Path $PWD 'release-notes.md'
            @("ProcSight $version development preview.", '',
              'Unsigned self-contained Windows x64 MSI; no development certificate import is required.', '',
              "Source commit: $env:EXPECTED_COMMIT", '',
              'See release-artifacts.json for the installer SHA-256. Review and edit these notes before publishing.') |
              Set-Content -LiteralPath $notes -Encoding utf8
            gh release create $env:REQUESTED_TAG $msiPath $manifestPath --repo $env:GH_REPO --verify-tag --draft --title "ProcSight $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation or asset upload failed. Inspect Releases before retrying.' }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Draft release prepared for $env:REQUESTED_TAG. Review assets and release notes at https://github.com/$env:GH_REPO/releases before publishing."
